# harbor, managed by Argo CD.
#
# The private registry holding the Spark job image. It has to be up
# and serving before the Spark operator runs anything, or every
# driver sits in ImagePullBackOff.
# 
# Its S3 credential is an IAM access key in a Secret rather than
# IRSA: distribution 2.8.x has no WebIdentityProvider in its
# credential chain, which is a property of the upstream image and not
# a choice made here.
#
# RUN THESE FIRST -- Argo CD cannot
# ----------------------------------
#   script/set_up_*/prod/05_harbor_prod/00_create_harbor_bucket_and_iam_prod.sh
#   script/set_up_*/prod/05_harbor_prod/01_create_harbor_secrets_prod.sh
#
# Argo CD reconciles Kubernetes objects against git and nothing else. It cannot
# create an IAM role, read AWS Secrets Manager, or tag an Auto Scaling group.
# That split is not a limitation to work around: anything holding a credential
# stays out of git by construction.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
  annotations:
    # Argo CD waits for a wave to report Healthy -- not merely Synced -- before
    # starting the next, so ordering here is guaranteed rather than raced.
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nopega/ice-berg-platform.git
    targetRevision: main
    path: script/set_up_component/05_harbor_prod/chart/harbor
    helm:
      # The vendored values.yaml, unchanged. Every deviation from upstream is
      # commented in place there and greppable with "data-platform)" -- there is
      # no second overrides file to keep in step.
      valueFiles:
        - values.yaml
      releaseName: harbor
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    # No `automated` block, deliberately. Every one of these is currently a
    # `helm install` release, and Argo CD applies rendered manifests without
    # talking to Helm -- so for a while there are two owners of the same
    # objects. Sync each one by hand, confirm it took ownership, then enable
    # automation per component.
    syncOptions:
      - CreateNamespace=true
