<svg viewBox="0 0 920 560" width="920" height="560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
<title>Apache Polaris - request flow</title>

<rect x="0" y="0" width="920" height="560" fill="#ffffff"/>

<defs>
  <marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
    <path d="M0,0 L9,3.5 L0,7" fill="none" stroke="#2563eb" stroke-width="2.2"/>
  </marker>
  <marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
    <path d="M0,0 L9,3.5 L0,7" fill="none" stroke="#64748b" stroke-width="2"/>
  </marker>
</defs>

<text x="36" y="40" font-size="20" font-weight="bold" fill="#0f172a">How a query resolves a table through Polaris</text>

<!-- ENGINE -->
<rect x="36" y="96" width="190" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text x="131" y="132" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Trino / Spark</text>
<text x="131" y="156" text-anchor="middle" font-size="13" fill="#475569">the engine</text>

<!-- POLARIS -->
<rect x="356" y="76" width="220" height="126" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="466" y="110" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Apache Polaris</text>
<text x="466" y="136" text-anchor="middle" font-size="13.5" fill="#334155">REST catalog + RBAC</text>
<text x="466" y="157" text-anchor="middle" font-size="13.5" fill="#334155">credential vending</text>
<text x="466" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">holds no data</text>

<!-- IAM -->
<rect x="700" y="96" width="184" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="792" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">IAM storage role</text>
<text x="792" y="148" text-anchor="middle" font-size="13" fill="#475569">sts:AssumeRole</text>
<text x="792" y="168" text-anchor="middle" font-size="12.5" fill="#64748b">scoped to one prefix</text>

<!-- RDS -->
<rect x="356" y="300" width="220" height="82" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="466" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">RDS Postgres</text>
<text x="466" y="352" text-anchor="middle" font-size="13" fill="#475569">which metadata.json</text>
<text x="466" y="370" text-anchor="middle" font-size="13" fill="#475569">is current</text>

<!-- S3 -->
<rect x="700" y="300" width="184" height="82" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
<text x="792" y="335" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">S3 warehouse</text>
<text x="792" y="359" text-anchor="middle" font-size="13" fill="#475569">Parquet + metadata</text>

<!-- 1: engine -> polaris -->
<path d="M226,118 L350,118" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>
<circle cx="288" cy="96" r="13" fill="#2563eb"/>
<text x="288" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
<text x="288" y="138" text-anchor="middle" font-size="12.5" fill="#1d4ed8">loadTable</text>

<!-- 4: polaris -> engine -->
<path d="M350,166 L232,166" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>
<circle cx="291" cy="196" r="13" fill="#2563eb"/>
<text x="291" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">4</text>
<text x="291" y="224" text-anchor="middle" font-size="12.5" fill="#1d4ed8">path + temp creds</text>

<!-- 2: polaris <-> rds -->
<path d="M450,208 L450,294" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ag)"/>
<path d="M482,294 L482,208" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ag)"/>
<circle cx="404" cy="251" r="13" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
<text x="404" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">2</text>

<!-- 3: polaris -> iam -->
<path d="M582,132 L694,132" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ag)"/>
<circle cx="638" cy="110" r="13" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
<text x="638" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">3</text>

<!-- 5: engine -> s3 direct -->
<path d="M131,190 L131,440 L792,440 L792,390" stroke="#16a34a" stroke-width="3" fill="none"
      marker-end="url(#ab)" stroke-dasharray="8 5"/>
<circle cx="460" cy="440" r="14" fill="#16a34a"/>
<text x="460" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">5</text>
<text x="460" y="424" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#15803d">data never passes through Polaris</text>

<!-- write note -->
<rect x="36" y="472" width="848" height="66" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
<text x="56" y="497" font-size="14" font-weight="bold" fill="#0f172a">Writing adds one step</text>
<text x="56" y="518" font-size="13" fill="#334155">Engine writes new Parquet + metadata.json to S3, then asks Polaris to swap the pointer. That swap is the atomic commit —</text>
<text x="56" y="533" font-size="13" fill="#334155">two writers racing means one wins and the other retries.</text>
</svg>
