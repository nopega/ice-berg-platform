<svg viewBox="0 0 1180 1030" width="1180" height="1030" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
<title>Iceberg lakehouse on Amazon EKS - system architecture</title>

<rect x="0" y="0" width="1180" height="1030" fill="#ffffff"/>

<defs>
  <marker id="arrOrange" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
    <path d="M0,0 L9,3.5 L0,7" fill="none" stroke="#ea580c" stroke-width="2.2"/>
  </marker>
  <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
    <path d="M0,0 L9,3.5 L0,7" fill="none" stroke="#2563eb" stroke-width="2.2"/>
  </marker>
  <marker id="arrSlate" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
    <path d="M0,0 L9,3.5 L0,7" fill="none" stroke="#64748b" stroke-width="2"/>
  </marker>
</defs>

<!-- ===================== TITLE ===================== -->
<text x="44" y="44" font-size="22" font-weight="bold" fill="#0f172a">Iceberg lakehouse on Amazon EKS</text>
<text x="44" y="70" font-size="14" fill="#475569">One catalog, two paths: Spark writes, Trino reads. Neither engine ever holds a long-lived AWS key.</text>

<!-- legend -->
<line x1="905" y1="38" x2="945" y2="38" stroke="#ea580c" stroke-width="3"/>
<text x="953" y="43" font-size="12.5" fill="#334155">write / ETL path</text>
<line x1="905" y1="60" x2="945" y2="60" stroke="#2563eb" stroke-width="3"/>
<text x="953" y="65" font-size="12.5" fill="#334155">read / query path</text>
<line x1="905" y1="82" x2="945" y2="82" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
<text x="953" y="87" font-size="12.5" fill="#334155">supporting</text>

<!-- ===================== EXTERNAL ROW ===================== -->
<rect x="60" y="110" width="260" height="60" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="190" y="136" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0f172a">NYC TLC — public source</text>
<text x="190" y="157" text-anchor="middle" font-size="12.5" fill="#475569">monthly Parquet over HTTPS</text>

<rect x="620" y="110" width="280" height="60" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="760" y="136" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0f172a">Power BI · DBeaver · JDBC</text>
<text x="760" y="157" text-anchor="middle" font-size="12.5" fill="#475569">username + password, nothing else</text>

<!-- ===================== ALB ===================== -->
<rect x="620" y="200" width="280" height="64" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text x="760" y="226" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">AWS ALB — one, shared</text>
<text x="760" y="248" text-anchor="middle" font-size="12.5" fill="#475569">6 hostnames · HTTPS 443 · IP allowlist</text>

<line x1="760" y1="170" x2="760" y2="198" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>
<line x1="760" y1="264" x2="760" y2="344" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>
<text x="772" y="284" font-size="11.5" fill="#64748b">TLS ends here; HTTP + X-Forwarded-* inward</text>

<!-- ===================== EKS BOUNDARY ===================== -->
<rect x="45" y="290" width="1095" height="530" rx="14" fill="none" stroke="#0f172a" stroke-width="2" stroke-dasharray="9 6"/>
<text x="66" y="316" font-size="13.5" font-weight="bold" fill="#0f172a">Amazon EKS 1.34 — data-platform-prod · nodes in private subnets across 2 AZ</text>

<!-- ===================== WRITE LANE ===================== -->
<rect x="120" y="346" width="260" height="80" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
<text x="250" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Airflow 3.2.2</text>
<text x="250" y="395" text-anchor="middle" font-size="12.5" fill="#475569">KubernetesExecutor · DAGs by git-sync</text>
<text x="250" y="414" text-anchor="middle" font-size="12.5" fill="#475569">creates SparkApplication, never a pod</text>

<rect x="120" y="456" width="260" height="64" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
<text x="250" y="482" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Spark Operator 2.5.0</text>
<text x="250" y="504" text-anchor="middle" font-size="12.5" fill="#475569">watches the CRD, creates the driver</text>

<rect x="120" y="550" width="260" height="110" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
<text x="250" y="578" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Spark 4.0.1 + Iceberg 1.10.2</text>
<text x="250" y="600" text-anchor="middle" font-size="12.5" fill="#475569">driver → ng-ondemand (critical)</text>
<text x="250" y="620" text-anchor="middle" font-size="12.5" fill="#475569">executors → ng-spot, 0 → N → 0</text>
<text x="250" y="643" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2410c">bronze → silver → gold</text>

<line x1="250" y1="426" x2="250" y2="454" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrOrange)"/>
<line x1="250" y1="520" x2="250" y2="548" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrOrange)"/>

<!-- TLC gutter arrow: source enters at the DRIVER, not through Airflow -->
<path d="M85,170 V605 H116" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="0" marker-end="url(#arrOrange)"/>
<text x="78" y="490" font-size="11.5" fill="#c2410c" transform="rotate(-90 78 490)" text-anchor="middle">the driver fetches the source</text>

<!-- ===================== READ LANE ===================== -->
<rect x="620" y="346" width="280" height="140" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="760" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Trino 480</text>
<text x="760" y="396" text-anchor="middle" font-size="12.5" fill="#475569">coordinator ×1 · workers 2–5 (HPA)</text>
<text x="760" y="416" text-anchor="middle" font-size="12.5" fill="#475569">password auth → access rules</text>
<text x="760" y="436" text-anchor="middle" font-size="12.5" fill="#475569">resource groups: Team A vs Team B</text>
<text x="760" y="460" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">the only door to the data</text>
<text x="760" y="478" text-anchor="middle" font-size="11.5" fill="#64748b">ng-ondemand</text>

<line x1="760" y1="486" x2="760" y2="698" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>

<!-- ===================== POLARIS ===================== -->
<rect x="290" y="700" width="600" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="590" y="730" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Apache Polaris 1.5.0 — Iceberg REST catalog</text>
<text x="590" y="754" text-anchor="middle" font-size="13" fill="#334155">RBAC · atomic commits · credential vending (sts:AssumeRole)</text>
<text x="590" y="778" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">holds no data — it hands each engine short-lived, scoped S3 credentials</text>

<path d="M250,660 V680 H430 V698" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrOrange)"/>

<!-- ===================== SUPPORTING PANEL ===================== -->
<rect x="905" y="336" width="215" height="462" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="1012" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748b">SUPPORTING</text>

<rect x="920" y="372" width="185" height="82" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="1012" y="396" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">Harbor 2.15.1</text>
<text x="1012" y="416" text-anchor="middle" font-size="11.5" fill="#475569">private registry, in-VPC</text>
<text x="1012" y="434" text-anchor="middle" font-size="11.5" fill="#475569">Trivy scan on push</text>

<rect x="920" y="470" width="185" height="82" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="1012" y="494" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">Prometheus 3.13.2</text>
<text x="1012" y="514" text-anchor="middle" font-size="11.5" fill="#475569">+ Grafana 13.1.3</text>
<text x="1012" y="532" text-anchor="middle" font-size="11.5" fill="#475569">scrapes every namespace</text>

<rect x="920" y="568" width="185" height="82" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="1012" y="592" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">Argo CD v3.5.0</text>
<text x="1012" y="612" text-anchor="middle" font-size="11.5" fill="#475569">app-of-apps, 8 releases</text>
<text x="1012" y="630" text-anchor="middle" font-size="11.5" fill="#475569">git is the desired state</text>

<rect x="920" y="666" width="185" height="82" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="1012" y="690" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">Cluster autoscaler</text>
<text x="1012" y="710" text-anchor="middle" font-size="11.5" fill="#475569">+ metrics-server, HPA</text>
<text x="1012" y="728" text-anchor="middle" font-size="11.5" fill="#475569">+ AWS LB controller</text>

<!-- ===================== AWS MANAGED ROW ===================== -->
<text x="60" y="848" font-size="12" font-weight="bold" fill="#64748b">AWS MANAGED</text>

<rect x="60" y="860" width="200" height="110" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="160" y="888" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">RDS Postgres 17</text>
<text x="160" y="909" text-anchor="middle" font-size="11.5" fill="#475569">db.t4g.micro, private</text>
<text x="160" y="928" text-anchor="middle" font-size="11.5" fill="#475569">iceberg_catalog</text>
<text x="160" y="946" text-anchor="middle" font-size="11.5" fill="#475569">airflow metadata</text>

<rect x="290" y="860" width="270" height="110" rx="9" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.5"/>
<text x="425" y="888" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">s3://…-warehouse</text>
<text x="425" y="909" text-anchor="middle" font-size="11.5" fill="#475569">Iceberg metadata + Parquet</text>
<text x="425" y="928" text-anchor="middle" font-size="11.5" fill="#475569">spec v3 · bronze / silver / gold</text>
<text x="425" y="948" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0369a1">partitioned on trip_date</text>

<rect x="580" y="860" width="175" height="110" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="667" y="888" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">s3://…-logs</text>
<text x="667" y="909" text-anchor="middle" font-size="11.5" fill="#475569">Spark event logs</text>
<text x="667" y="928" text-anchor="middle" font-size="11.5" fill="#475569">Airflow task logs</text>
<text x="667" y="946" text-anchor="middle" font-size="11.5" fill="#475569">lifecycle-expired</text>

<rect x="775" y="860" width="175" height="110" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="862" y="888" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">s3://…-registry</text>
<text x="862" y="909" text-anchor="middle" font-size="11.5" fill="#475569">Harbor image layers</text>
<text x="862" y="928" text-anchor="middle" font-size="11.5" fill="#475569">no EBS to outgrow</text>

<rect x="970" y="860" width="165" height="110" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="1052" y="888" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">Secrets Manager</text>
<text x="1052" y="909" text-anchor="middle" font-size="11.5" fill="#475569">source of truth for</text>
<text x="1052" y="928" text-anchor="middle" font-size="11.5" fill="#475569">every credential</text>
<text x="1052" y="946" text-anchor="middle" font-size="11.5" fill="#475569">K8s Secrets mirror it</text>

<!-- Polaris -> warehouse, Polaris -> RDS -->
<path d="M560,796 V828 H425 V858" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>
<path d="M330,796 V812 H225 V858" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrSlate)"/>

<text x="600" y="848" font-size="11.5" fill="#1d4ed8">engines read and write S3 directly, on vended credentials</text>

<!-- footer -->
<text x="44" y="1000" font-size="12.5" fill="#475569">Every S3 arrow leaves the VPC through the <tspan font-weight="bold" fill="#0f172a">S3 gateway endpoint</tspan> — no hourly rate, no per-GB rate, no NAT charge: the largest single saving here.</text>
<text x="44" y="1020" font-size="12.5" fill="#475569">Versions are those pinned in this repository; see <tspan font-weight="bold" fill="#0f172a">docs/STACK_SUMMARY.md</tspan> for the compatibility matrix that produced them.</text>

</svg>
