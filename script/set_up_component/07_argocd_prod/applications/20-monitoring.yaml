# monitoring, managed by Argo CD.
#
# Installs the ServiceMonitor and PrometheusRule CRDs. Four charts
# below create objects of those kinds, and a chart cannot create an
# object whose kind the API server does not know -- it fails with
# `no matches for kind`. This is the same dependency that made
# monitoring step 06 rather than 10 in the numbered scripts.
#
# RUN THESE FIRST -- Argo CD cannot
# ----------------------------------
#   script/set_up_*/prod/06_monitoring_prod/00_create_grafana_secret_prod.sh
#   script/set_up_*/prod/06_monitoring_prod/02_create_grafana_cloudwatch_irsa_prod.sh
#
# Argo CD reconciles Kubernetes objects against git and nothing else. It cannot
# create an IAM role, read AWS Secrets Manager, or tag an Auto Scaling group.
# That split is not a limitation to work around: anything holding a credential
# stays out of git by construction.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    # Argo CD waits for a wave to report Healthy -- not merely Synced -- before
    # starting the next, so ordering here is guaranteed rather than raced.
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nopega/ice-berg-platform.git
    targetRevision: main
    path: script/set_up_cluster/06_monitoring_prod/chart/kube-prometheus-stack
    helm:
      # The vendored values.yaml, unchanged. Every deviation from upstream is
      # commented in place there and greppable with "data-platform)" -- there is
      # no second overrides file to keep in step.
      valueFiles:
        - values.yaml
      releaseName: kube-prometheus-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    # No `automated` block, deliberately. Every one of these is currently a
    # `helm install` release, and Argo CD applies rendered manifests without
    # talking to Helm -- so for a while there are two owners of the same
    # objects. Sync each one by hand, confirm it took ownership, then enable
    # automation per component.
    syncOptions:
      - CreateNamespace=true
      # Several Prometheus Operator CRDs exceed the 256KB limit on the
      # last-applied-configuration annotation that client-side apply uses.
      # The error when they do names the annotation, not the size.
      - ServerSideApply=true
      # This chart contains ServiceMonitors whose CRDs the same sync
      # installs. Without this the dry-run fails on kinds that do not
      # exist yet -- correctly, and uselessly.
      - SkipDryRunOnMissingResource=true
