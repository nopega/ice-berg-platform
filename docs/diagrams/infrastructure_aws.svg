<svg viewBox="0 0 1180 950" width="1180" height="950" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
<title>Infrastructure layer - AWS resources and network layout</title>

<rect x="0" y="0" width="1180" height="950" fill="#ffffff"/>

<defs>
  <marker id="aBlue" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
    <path d="M0,0 L9,3.5 L0,7" fill="none" stroke="#2563eb" stroke-width="2.2"/>
  </marker>
  <marker id="aTeal" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
    <path d="M0,0 L9,3.5 L0,7" fill="none" stroke="#0d9488" stroke-width="2.2"/>
  </marker>
  <marker id="aSlate" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
    <path d="M0,0 L9,3.5 L0,7" fill="none" stroke="#64748b" stroke-width="2"/>
  </marker>
  <marker id="aPurple" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
    <path d="M0,0 L9,3.5 L0,7" fill="none" stroke="#7c3aed" stroke-width="2.2"/>
  </marker>
</defs>

<!-- ===================== TITLE ===================== -->
<text x="44" y="42" font-size="22" font-weight="bold" fill="#0f172a">Infrastructure — the AWS layer</text>
<text x="44" y="66" font-size="14" fill="#475569">What exists before a single container does. Everything here is created by <tspan font-family="Menlo, monospace" font-size="13">script/set_up_cluster/</tspan>.</text>

<!-- ===================== EXTERNAL ROW ===================== -->
<rect x="60" y="92" width="240" height="52" rx="9" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
<text x="180" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">GitHub</text>
<text x="180" y="134" text-anchor="middle" font-size="11.5" fill="#475569">manifests · DAGs · pipeline code</text>

<rect x="380" y="92" width="280" height="52" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="520" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Users · BI clients</text>
<text x="520" y="134" text-anchor="middle" font-size="11.5" fill="#475569">from allowlisted source IPs only</text>

<rect x="720" y="92" width="240" height="52" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="840" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Cloudflare DNS</text>
<text x="840" y="134" text-anchor="middle" font-size="11.5" fill="#475569">nopega.net · DNS-only, never proxied</text>

<path d="M718,118 H664" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aSlate)"/>

<!-- ===================== AWS REGION ===================== -->
<rect x="45" y="185" width="1095" height="715" rx="14" fill="none" stroke="#0f172a" stroke-width="2"/>
<text x="66" y="210" font-size="13.5" font-weight="bold" fill="#0f172a">AWS · ap-southeast-1</text>

<!-- ===================== VPC ===================== -->
<rect x="70" y="232" width="700" height="640" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2" stroke-dasharray="8 5"/>
<text x="88" y="256" font-size="13" font-weight="bold" fill="#334155">VPC — 2 Availability Zones</text>

<!-- PUBLIC SUBNETS -->
<rect x="90" y="282" width="660" height="112" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="104" y="301" font-size="11.5" font-weight="bold" fill="#3b82f6">PUBLIC SUBNETS · one per AZ</text>

<rect x="110" y="310" width="370" height="72" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<text x="295" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Application Load Balancer</text>
<text x="295" y="352" text-anchor="middle" font-size="11.5" fill="#475569">one, shared · 6 hostnames · HTTPS 443 only</text>
<text x="295" y="371" text-anchor="middle" font-size="11.5" fill="#475569">source-IP allowlist · ~$22/mo</text>

<rect x="500" y="310" width="230" height="72" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="615" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">NAT gateway × 1</text>
<text x="615" y="352" text-anchor="middle" font-size="11.5" fill="#475569">not one per AZ — deliberate</text>
<text x="615" y="371" text-anchor="middle" font-size="11.5" fill="#475569">~$32/mo + $0.045/GB</text>

<!-- PRIVATE SUBNETS -->
<rect x="90" y="414" width="660" height="440" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="104" y="433" font-size="11.5" font-weight="bold" fill="#64748b">PRIVATE SUBNETS · one per AZ</text>

<rect x="110" y="446" width="300" height="126" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
<text x="260" y="470" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">ng-ondemand</text>
<text x="260" y="490" text-anchor="middle" font-size="11.5" fill="#475569">m5.large — min 5 · desired 5 · max 7</text>
<text x="260" y="509" text-anchor="middle" font-size="11.5" fill="#475569">label workload=critical</text>
<text x="260" y="528" text-anchor="middle" font-size="11.5" fill="#475569">50Gi gp3 root volume each</text>
<text x="260" y="551" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">min = desired, on purpose</text>

<rect x="430" y="446" width="300" height="126" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="580" y="470" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">ng-spot</text>
<text x="580" y="490" text-anchor="middle" font-size="11.5" fill="#475569">m5 / m5a / m5d / m4.large — max 4</text>
<text x="580" y="509" text-anchor="middle" font-size="11.5" fill="#475569">workload=batch + taint spot=true</text>
<text x="580" y="528" text-anchor="middle" font-size="11.5" fill="#475569">100Gi gp3 root volume each</text>
<text x="580" y="551" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">desired 0 — nothing running now</text>

<rect x="100" y="592" width="640" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="420" y="616" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">Kubernetes workloads run on these nodes</text>
<text x="420" y="635" text-anchor="middle" font-size="10.5" fill="#475569">Polaris · Trino · Airflow · Spark · Harbor · Prometheus · <tspan font-weight="bold" fill="#6d28d9">Argo CD</tspan></text>
<text x="420" y="653" text-anchor="middle" font-size="10.5" fill="#64748b">the platform layer — shown here only to say where it lives</text>

<rect x="110" y="690" width="300" height="110" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="260" y="714" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">RDS Postgres 17</text>
<text x="260" y="734" text-anchor="middle" font-size="11.5" fill="#475569">db.t4g.micro · 20Gi gp3 · single-AZ</text>
<text x="260" y="753" text-anchor="middle" font-size="11.5" fill="#475569">iceberg_catalog + airflow</text>
<text x="260" y="772" text-anchor="middle" font-size="11.5" fill="#475569">automated backup + PITR, 1 day</text>
<text x="260" y="791" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">no public endpoint, ever</text>

<rect x="440" y="690" width="290" height="110" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.5"/>
<text x="585" y="714" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">S3 gateway VPC endpoint</text>
<text x="585" y="734" text-anchor="middle" font-size="11.5" fill="#475569">a route-table entry, not a device</text>
<text x="585" y="754" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f766e">$0/hour · $0/GB</text>
<text x="585" y="776" text-anchor="middle" font-size="11.5" fill="#475569">keeps warehouse traffic off the NAT —</text>
<text x="585" y="792" text-anchor="middle" font-size="11.5" fill="#475569">1 TB scanned would be ~$45 through it</text>

<!-- ===================== REGION / GLOBAL SERVICES ===================== -->
<text x="800" y="222" font-size="11.5" font-weight="bold" fill="#64748b">MANAGED SERVICES — outside the VPC</text>

<rect x="800" y="232" width="320" height="78" rx="9" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="960" y="257" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">EKS control plane 1.34</text>
<text x="960" y="277" text-anchor="middle" font-size="11.5" fill="#475569">AWS-managed, in no VPC of ours · ~$73/mo</text>
<text x="960" y="296" text-anchor="middle" font-size="11.5" fill="#475569">control-plane logging deliberately off</text>

<rect x="800" y="340" width="320" height="180" rx="9" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.5"/>
<text x="960" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Amazon S3 — three buckets</text>
<text x="820" y="392" font-size="11.5" font-weight="bold" fill="#0369a1">…-warehouse</text>
<text x="940" y="392" font-size="11.5" fill="#475569">Iceberg Parquet + metadata</text>
<text x="820" y="416" font-size="11.5" font-weight="bold" fill="#0369a1">…-logs</text>
<text x="940" y="416" font-size="11.5" fill="#475569">Spark events · Airflow logs</text>
<text x="820" y="440" font-size="11.5" font-weight="bold" fill="#0369a1">…-registry</text>
<text x="940" y="440" font-size="11.5" fill="#475569">Harbor image layers</text>
<text x="960" y="470" text-anchor="middle" font-size="11.5" fill="#475569">lifecycle rules keyed on the prefix,</text>
<text x="960" y="487" text-anchor="middle" font-size="11.5" fill="#475569">which is also the catalog namespace</text>
<text x="960" y="507" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0369a1">the durable half of the platform</text>

<rect x="800" y="548" width="320" height="76" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="960" y="573" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">AWS Secrets Manager</text>
<text x="960" y="593" text-anchor="middle" font-size="11.5" fill="#475569">source of truth for every credential</text>
<text x="960" y="611" text-anchor="middle" font-size="11.5" fill="#475569">K8s Secrets are a mirror, written by scripts</text>

<rect x="800" y="644" width="320" height="76" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="960" y="669" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">ACM certificate</text>
<text x="960" y="689" text-anchor="middle" font-size="11.5" fill="#475569">6 names on one cert · DNS-validated</text>
<text x="960" y="707" text-anchor="middle" font-size="11.5" fill="#475569">immutable — a new name means a new cert</text>

<rect x="800" y="740" width="320" height="76" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="960" y="765" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">IAM + EKS OIDC provider</text>
<text x="960" y="785" text-anchor="middle" font-size="11.5" fill="#475569">8 IRSA roles, one per workload</text>
<text x="960" y="803" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">no static AWS key in the cluster</text>

<!-- ===================== ARROWS ===================== -->

<!-- users -> ALB -->
<path d="M520,146 V278 H400 V306" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#aBlue)"/>
<text x="532" y="200" font-size="11.5" fill="#2563eb">HTTPS 443</text>

<!-- ALB -> nodes -->
<path d="M350,382 V444" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#aBlue)"/>
<text x="150" y="406" font-size="11.5" fill="#2563eb">HTTP + X-Forwarded-*</text>

<!-- nodes -> NAT -->
<path d="M700,444 V386" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aSlate)"/>
<text x="470" y="406" font-size="11.5" fill="#64748b">egress: image pulls, TLC download</text>

<!-- GitHub -> workloads (Argo CD), down the left gutter -->
<path d="M180,146 V172 H58 V628 H96" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#aPurple)"/>
<text x="102" y="585" font-size="11.5" font-weight="bold" fill="#7c3aed">Argo CD reconciles the cluster from git</text>

<!-- EKS control plane <-> nodes -->
<path d="M798,271 H774" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aSlate)"/>
<text x="648" y="266" font-size="11.5" fill="#64748b">API ↔ kubelet</text>

<!-- workloads -> RDS -->
<path d="M200,662 V686" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#aSlate)"/>

<!-- workloads -> S3 endpoint -->
<path d="M585,662 V686" fill="none" stroke="#0d9488" stroke-width="2.5" marker-end="url(#aTeal)"/>

<!-- S3 endpoint -> S3 -->
<path d="M730,745 H785 V440 H796" fill="none" stroke="#0d9488" stroke-width="2.5" marker-end="url(#aTeal)"/>

<!-- footer -->
<text x="44" y="925" font-size="12.5" fill="#475569">The two lines that matter most on this page are the cheapest ones: the <tspan font-weight="bold" fill="#0f766e">teal path to S3</tspan>, which never touches the NAT, and <tspan font-weight="bold" fill="#0f172a">ng-spot at zero</tspan>, which bills nothing while idle.</text>

</svg>
