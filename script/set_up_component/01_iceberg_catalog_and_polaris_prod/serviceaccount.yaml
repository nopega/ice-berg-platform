# serviceaccount.yaml
#
# The Kubernetes identity that IRSA is bound to (see
# ../../set_up_cluster/03_irsa_role_prod/). Any pod that sets
# `serviceAccountName: data-platform-workload` gets the temporary AWS
# credentials for data-platform-prod-irsa-role automatically injected by the
# EKS Pod Identity webhook — no Access Key anywhere in this manifest or the
# container image.
#
# __IRSA_ROLE_ARN__ is filled in by 01_create_namespace_and_sa_prod.sh at
# apply time (it contains the AWS account ID, so it can't be a static value
# committed as-is across accounts).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-platform-workload
  namespace: data-platform
  annotations:
    eks.amazonaws.com/role-arn: "__IRSA_ROLE_ARN__"
